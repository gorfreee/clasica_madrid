				"description":"<p><!-- wp:paragraph --></p> <p><!-- /wp:paragraph --></p> <p><!-- wp:preformatted --></p> <pre class='wp-block-preformatted'><strong>LA PASIÓN DE FALLA<br>DOMINGO 22 DE NOVIEMBRE DE 2026, 18:00 H<br><br>Danza<br>Teatro Salón Cervantes</strong> / calle Cervantes, 7<br><br><a href='https://www.escueladedanzapepevento.es' target='_blank' rel='noreferrer noopener'><mark style='background-color:rgba(0, 0, 0, 0)' class='has-inline-color has-accent-color'>www.escueladedanzapepevento.es</mark></a><br>Alcalá a Escena<br><br><strong>Bailarines: </strong>José María Vento García, Sara Pérez López, Justo Piquet Grande, Ana del Rey Guerra, María Nadal González, Virginia Guiñales Agustín, Josemanuel Vento Tejada, Pilar Tejada Martínez, José María Vento García, Álvaro Vento Tejada, Irene Piquet Tejada, Anabel Expósito Hervás, Sara Pérez López, Alexandru Nicolas Petaca, Paula Aznar Jiménez, Cyntia Martin-Gil Murray, Irene Domínguez Mielgo, Paula Santos Sánchez, Noa López Roldán, Carla Tormo González. <br><strong>Producción: </strong>Escuela de Danza Pepe Vento.</pre> <p><!-- /wp:preformatted --></p> <p><!-- wp:paragraph --></p> <p>Con motivo del 150 aniversario del nacimiento de Manuel de Falla (1876–2026), el Ballet Albéniz presenta <em>La Pasión de Falla</em>, una producción escénica concebida como homenaje a uno de los compositores más universales e influyentes de la música española.</p> <p><!-- /wp:paragraph --></p> <p><!-- wp:paragraph --></p> <p>Desde Alcalá de Henares, Ciudad Patrimonio de la Humanidad y referente cultural, el Ballet Albéniz reafirma su compromiso con la promoción, difusión y preservación de la danza española mediante una propuesta que combina excelencia artística, respeto por la tradición y una mirada escénica contemporánea.</p> <p><!-- /wp:paragraph --></p> <p><!-- wp:paragraph --></p> <p><em>La Pasión de Falla</em> trasciende el homenaje musical para convertirse en un recorrido por el universo creativo del compositor, donde la danza española estilizada, la escuela bolera y el flamenco, dialogan con algunas de sus obras más emblemáticas. La producción pone en valor la riqueza de un legado que ha marcado profundamente la evolución de la danza española y del flamenco escénico, ofreciendo un espectáculo de gran calidad artística, visual y técnica.</p> <p><!-- /wp:paragraph --></p> <p><!-- wp:paragraph --></p> <p>La propuesta se inspira en los grandes ejes que vertebran la obra de Falla: la fusión entre lo popular y lo culto, el encuentro entre lo ritual y lo teatral y la proyección universal de la identidad cultural española. Desde esa premisa, el Ballet Albéniz ofrece una lectura escénica actual que preserva la esencia del compositor y, al mismo tiempo, conecta con la sensibilidad del público contemporáneo.</p> <p><!-- /wp:paragraph --></p> ","location":[{"@type":"Place","name":"TEATRO SALÓN CERVANTES","address":{"@type": "PostalAddress","streetAddress":"Calle Cervantes , 7 - Alcalá de Henares (MADRID)"}}]}</script>
