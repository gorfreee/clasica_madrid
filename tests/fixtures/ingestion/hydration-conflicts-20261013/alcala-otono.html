				"description":"<p><!-- wp:paragraph --></p> <p><!-- /wp:paragraph --></p> <p><!-- wp:preformatted --></p> <pre class='wp-block-preformatted'><strong>VIERNES 13 Y SÁBADO 14 DE NOVIEMBRE DE 2026, 21:00 H<br>OTOÑO CREPUSCULAR A LA LUZ DE LAS VELAS<br><br>Capilla de la Fundación Antezana</strong> / Calle Mayor, 46<br></pre> <p><!-- /wp:preformatted --></p> <p><!-- wp:paragraph --></p> <p><!-- /wp:paragraph --></p> <p><!-- wp:paragraph --></p> <p>El otoño, la estación de los románticos, precursores de los movimientos más sentimentales. Miramos hacia la puesta de sol y nos encontramos con personajes mágicos que van apareciendo a medida que el sol se esconde tras las montañas.</p> <p><!-- /wp:paragraph --></p> <p><!-- wp:paragraph --></p> <p>ALGUNAS DE LAS OBRAS: <br /><em>Otoño</em> &#8211; Vivaldi <br /><em>La Reina de la Noche</em> &#8211; Mozart <br /><em>Escena Andaluza: Crepúsculo Serenata</em> &#8211; Turina Squirrel &#8211; Beeftink <br /><em>Otoño</em> &#8211; Piazzoll</p> <p><!-- /wp:paragraph --></p> <p><!-- wp:paragraph --></p> <p><strong>El ciclo de cuatro conciertos “Las Estaciones” de Sapere Aude Ensemble de Juventudes  Musicales de Alcalá</strong> es una propuesta  inmersiva entre dos fenómenos: el primero,  la estación a la que corresponde la época del  año; el segundo, un hilo conductor entre las  obras de múltiples épocas y compositores.</p> <p><!-- /wp:paragraph --></p> <p><!-- wp:paragraph --></p> <p>Mozart, Schubert, Tchaikovsky y Beeftink son algunos de los compositores que irán apareciendo en cada estación, siempre bajo la referencia de Vivaldi y Piazzolla, los dos pilares que marcarán el comienzo y fin de cada concierto. </p> <p><!-- /wp:paragraph --></p> <p><!-- wp:paragraph --></p> <p>Todos los conciertos irán acompañados de una narración que acerca las obras al público.</p> <p><!-- /wp:paragraph --></p> ","location":[{"@type":"Place","name":"HOSPITAL DE ANTEZANA","address":{"@type": "PostalAddress","streetAddress":"C. Mayor, 46, 28801"}}]}</
