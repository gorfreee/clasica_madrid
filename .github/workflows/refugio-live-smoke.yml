name: Refugio live smoke

on:
  pull_request:
    paths:
      - 'src/ingestion/browser-fetch.ts'
      - 'src/ingestion/sources/real-hermandad-refugio.ts'
      - 'src/ingestion/detail/real-hermandad-refugio.ts'
      - 'src/ingestion/http.ts'
      - 'src/ingestion/listing-retry.ts'
      - 'src/ingestion/pipeline.ts'
      - 'src/ingestion/observability.ts'
      - 'src/ingestion/registry.ts'
      - 'src/cli/refugio-live-smoke.ts'
      - '.github/workflows/refugio-live-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Live Refugio archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check system Chrome
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null; then
            echo "google-chrome no está en el runner ubuntu-24.04" >&2
            exit 1
          fi
          google-chrome --version

      - name: Acquire live Refugio archive
        shell: bash
        run: npm run ingest:refugio-live-smoke
