name: Daily site rebuild

# Cloudflare Pages normally rebuilds only on git changes. Clock-dependent
# presentation (Hoy, Mañana, Fin de semana, isPast, próximos conciertos)
# is computed at build time, so a day without a deploy would go stale.
# This workflow POSTs a Deploy Hook that rebuilds `main` — no empty commits.

on:
  schedule:
    # GitHub cron is UTC. 00:15 Europe/Madrid is 22:15 UTC (CEST) or 23:15 UTC (CET).
    - cron: '15 22 * * *'
    - cron: '15 23 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-site-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    name: Trigger Cloudflare Pages rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard Europe/Madrid midnight
        id: guard
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          madrid_now=$(TZ=Europe/Madrid date --iso-8601=seconds)
          madrid_hour=$(TZ=Europe/Madrid date +%H)
          if [[ "$madrid_hour" != "00" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Fuera de la ventana de medianoche en Europe/Madrid ($madrid_now). No se dispara el deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Dentro de la ventana de medianoche en Europe/Madrid ($madrid_now)."
          fi

      - name: Trigger Cloudflare Pages deploy hook
        if: steps.guard.outputs.skip != 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOOK_URL}" ]]; then
            echo "::error::El secret CLOUDFLARE_PAGES_DEPLOY_HOOK_URL no está configurado."
            echo "Crea un Deploy Hook en Cloudflare Pages apuntando a main y guárdalo como secret de Actions." >&2
            exit 1
          fi
          body="${RUNNER_TEMP}/cloudflare-pages-deploy-hook-body"
          http_code=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 15 \
            --max-time 30 \
            -X POST \
            -o "$body" \
            -w '%{http_code}' \
            "$DEPLOY_HOOK_URL")
          echo "Cloudflare Pages respondió HTTP ${http_code}."
