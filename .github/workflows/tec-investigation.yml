name: TEC transport investigation
on:
  pull_request:
    paths:
      - '.github/workflows/tec-investigation.yml'
      - 'scripts/probe-tec-transport.mjs'
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Check public official responses
        env:
          INGEST_FETCH_RELAY_URL: ${{ vars.INGEST_FETCH_RELAY_URL }}
          INGEST_FETCH_RELAY_TOKEN: ${{ secrets.INGEST_FETCH_RELAY_TOKEN }}
        run: node scripts/probe-tec-transport.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tec-transport-${{ github.run_id }}
          path: ingestion/work/tec-transport/results/
