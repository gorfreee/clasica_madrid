name: AI live qualification

# Deterministic quality benchmark of every configured AI pool route against a
# representative fixture set. Manual only: this consumes real provider quota
# and must never run on push, PR, or a schedule. Distinct from live smoke.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: core ≈ 17 casos (cabe en RPD Gemini flash); full = dataset completo
        type: choice
        options:
          - core
          - full
        default: core
        required: true
      purposes:
        description: "Purposes separados por coma. Vacío = todos (eligibility, composer-extraction, formats, eras, access-classification)"
        type: string
        required: false
      providers:
        description: "Providers separados por coma (gemini, groq, mistral, zai, cloudflare). Vacío = todos"
        type: string
        required: false
      routes:
        description: "Routes exactas provider:model, separadas por coma. Vacío = todas las del pool"
        type: string
        required: false
      models:
        description: "IDs de modelo (exacto o sufijo). Vacío = todos"
        type: string
        required: false
      max_cases:
        description: Tope de casos tras filtrar suite/purpose. Vacío = sin tope
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ai-live-qualification
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualification benchmark for AI routes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AI_PROVIDER: pool
      AI_ZERO_COST_ONLY: 'true'
      AI_CACHE: 'off'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_FREE_TIER_CONFIRMED: ${{ vars.GROQ_FREE_TIER_CONFIRMED }}
      GROQ_MODELS: ${{ vars.GROQ_MODELS }}
      GROQ_MODEL_RPM: ${{ vars.GROQ_MODEL_RPM }}
      GROQ_MODEL_TPM: ${{ vars.GROQ_MODEL_TPM }}
      GROQ_MODEL_RPD: ${{ vars.GROQ_MODEL_RPD }}
      GROQ_MODEL_MAX_CONCURRENT: ${{ vars.GROQ_MODEL_MAX_CONCURRENT }}
      GROQ_MODEL_MIN_INTERVAL_MS: ${{ vars.GROQ_MODEL_MIN_INTERVAL_MS }}
      GROQ_MAX_CONCURRENT: ${{ vars.GROQ_MAX_CONCURRENT }}
      GROQ_MIN_INTERVAL_MS: ${{ vars.GROQ_MIN_INTERVAL_MS }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_FREE_MODE_CONFIRMED: ${{ vars.MISTRAL_FREE_MODE_CONFIRMED }}
      MISTRAL_MODELS: ${{ vars.MISTRAL_MODELS }}
      MISTRAL_MODEL_RPM: ${{ vars.MISTRAL_MODEL_RPM }}
      MISTRAL_MODEL_TPM: ${{ vars.MISTRAL_MODEL_TPM }}
      MISTRAL_MODEL_RPD: ${{ vars.MISTRAL_MODEL_RPD }}
      MISTRAL_MODEL_MAX_CONCURRENT: ${{ vars.MISTRAL_MODEL_MAX_CONCURRENT }}
      MISTRAL_MODEL_MIN_INTERVAL_MS: ${{ vars.MISTRAL_MODEL_MIN_INTERVAL_MS }}
      MISTRAL_MAX_CONCURRENT: ${{ vars.MISTRAL_MAX_CONCURRENT }}
      MISTRAL_MIN_INTERVAL_MS: ${{ vars.MISTRAL_MIN_INTERVAL_MS }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_MODELS: ${{ vars.ZAI_MODELS }}
      ZAI_MODEL_RPM: ${{ vars.ZAI_MODEL_RPM }}
      ZAI_MODEL_TPM: ${{ vars.ZAI_MODEL_TPM }}
      ZAI_MODEL_RPD: ${{ vars.ZAI_MODEL_RPD }}
      ZAI_MODEL_MAX_CONCURRENT: ${{ vars.ZAI_MODEL_MAX_CONCURRENT }}
      ZAI_MODEL_MIN_INTERVAL_MS: ${{ vars.ZAI_MODEL_MIN_INTERVAL_MS }}
      ZAI_MAX_CONCURRENT: ${{ vars.ZAI_MAX_CONCURRENT }}
      ZAI_MIN_INTERVAL_MS: ${{ vars.ZAI_MIN_INTERVAL_MS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
      CLOUDFLARE_MODELS: ${{ vars.CLOUDFLARE_MODELS }}
      CLOUDFLARE_MODEL_RPM: ${{ vars.CLOUDFLARE_MODEL_RPM }}
      CLOUDFLARE_MODEL_TPM: ${{ vars.CLOUDFLARE_MODEL_TPM }}
      CLOUDFLARE_MODEL_RPD: ${{ vars.CLOUDFLARE_MODEL_RPD }}
      CLOUDFLARE_MODEL_MAX_CONCURRENT: ${{ vars.CLOUDFLARE_MODEL_MAX_CONCURRENT }}
      CLOUDFLARE_MODEL_MIN_INTERVAL_MS: ${{ vars.CLOUDFLARE_MODEL_MIN_INTERVAL_MS }}
      CLOUDFLARE_MAX_CONCURRENT: ${{ vars.CLOUDFLARE_MAX_CONCURRENT }}
      CLOUDFLARE_MIN_INTERVAL_MS: ${{ vars.CLOUDFLARE_MIN_INTERVAL_MS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run AI qualification
        id: qualify
        env:
          SUITE: ${{ inputs.suite }}
          PURPOSES: ${{ inputs.purposes }}
          PROVIDERS: ${{ inputs.providers }}
          ROUTES: ${{ inputs.routes }}
          MODELS: ${{ inputs.models }}
          MAX_CASES: ${{ inputs.max_cases }}
          REPORT_DIR: ${{ runner.temp }}/ai-qualify-report
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p "$REPORT_DIR"
          args=(--suite "$SUITE" --report-dir "$REPORT_DIR" --summary "$GITHUB_STEP_SUMMARY")
          if [[ -n "${PURPOSES:-}" ]]; then
            args+=(--purposes "$PURPOSES")
          fi
          if [[ -n "${PROVIDERS:-}" ]]; then
            args+=(--providers "$PROVIDERS")
          fi
          if [[ -n "${ROUTES:-}" ]]; then
            args+=(--routes "$ROUTES")
          fi
          if [[ -n "${MODELS:-}" ]]; then
            args+=(--models "$MODELS")
          fi
          if [[ -n "${MAX_CASES:-}" ]]; then
            args+=(--max-cases "$MAX_CASES")
          fi
          npm run ai:qualify -- "${args[@]}"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "report_dir=$REPORT_DIR" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish qualification report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ai-qualify-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ai-qualify-report/ai-qualify-report.md
            ${{ runner.temp }}/ai-qualify-report/ai-qualify-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if qualification failed
        if: always() && steps.qualify.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.qualify.outputs.exit_code }}"
