name: CDCM live validation
on:
  pull_request:
    paths:
      - '.github/workflows/cdcm-validation.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run real adapters without publishing
        run: node --import tsx src/cli/ingest.ts sync --sources teatros-canal,teatro-auditorio-escorial --dry-run --from 2026-11-12 --to 2027-08-31 --report ingestion/work/cdcm-live/report.json
      - name: Verify official Views pagination transport
        run: |
          node --import tsx --input-type=module - <<'JS'
          import {writeFile} from 'node:fs/promises';
          import {getText} from './src/ingestion/http.ts';
          import {CDCM_CANAL_LIST,cdcmAjaxUrl} from './src/ingestion/detail/cdcm.ts';
          const html=await getText(CDCM_CANAL_LIST.replace('/categoria/musica',''));
          const settings=JSON.parse(/data-drupal-selector="drupal-settings-json">([\s\S]*?)<\/script>/.exec(html)[1]);
          const view=Object.values(settings.views.ajaxViews)[0];
          const body=await getText(cdcmAjaxUrl(view,1));
          const commands=JSON.parse(body);
          if(!commands.some(c=>c.command==='insert'&&c.method==='infiniteScrollInsertView'&&c.selector===`.js-view-dom-id-${view.view_dom_id}`))throw Error('Views contract unavailable');
          await writeFile('ingestion/work/cdcm-live/views-page1.json',body);
          JS
      - name: Assert recovered sources and catalogue boundary
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const {summary:s}=JSON.parse(readFileSync('ingestion/work/cdcm-live/report.json','utf8'));
          if(s.sourcesFailed.length || s.detailHydrationFailed || !s.detailHydrationSucceeded || s.possiblyMissing || s.newEvents) throw Error('CDCM not recovered conservatively');
          for(const id of ['teatros-canal','teatro-auditorio-escorial']) if(!s.sourceResults[id].usable || s.sourceResults[id].disappearanceEligible) throw Error('invalid coverage');
          JS
          git diff --exit-code -- data/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: cdcm-live-${{ github.run_id }}
          path: ingestion/work/cdcm-live/
