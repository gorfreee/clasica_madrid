name: CDCM live validation
on:
  pull_request:
    paths:
      - 'scripts/probe-cdcm.mjs'
      - '.github/workflows/cdcm-validation.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/probe-cdcm.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdcm-${{ github.run_id }}
          path: ingestion/work/cdcm-probe/
